# ark 备份清单示例
#
# 这份示例对应一台部署了 sub2api 的机器。复制到 /etc/ark/ark.yaml 后按实际情况修改，
# 然后依次执行：
#   ark validate    # 检查清单本身写得对不对（不碰 docker，任何机器都能跑）
#   ark doctor      # 检查这台机器上是否真的具备执行条件

version: 1

# 本机标识。它会成为对象存储中的一段路径，用来区分不同机器的备份。
# 只允许小写字母、数字和中划线。
host: web-01

# 被备份的 docker compose 项目。
project:
  name: sub2api
  compose_file: /root/sub2api/deploy/docker-compose.yml
  env_file: /root/sub2api/deploy/.env
  # 显式声明 compose 项目名，避免误操作同一台机器上的另一套部署。
  project_name: deploy

# 备份仓库。密码和对象存储凭证都放在独立文件里，权限必须是 0600。
#
# 重要：repo.password_file 的内容必须另外保存一份在这台机器之外
# （密码管理器 / 离线介质）。只存在于生产机上的仓库密码，
# 在机器损毁时会让所有备份一起变成无法解密的废数据。
repo:
  type: restic
  url: "s3:https://<account-id>.r2.cloudflarestorage.com/<bucket>/web-01"
  password_file: /etc/ark/repo.pass
  env_file: /etc/ark/repo.env

# 备份目标。顺序不重要，恢复顺序由 ark 按类型自行编排。
targets:
  # 数据库走 pg_dump 逻辑备份。
  # 绝不要改成直接备份 PGDATA 卷：运行中的数据目录热拷贝出来是不一致的。
  - type: postgres
    service: postgres
    database: sub2api
    user: sub2api

  # Redis 触发 BGSAVE 后取走 RDB。如果 Redis 里只有可重建的缓存，
  # 可以整条删掉以缩短备份时间。
  - type: redis
    service: redis

  # 应用数据卷（上传的文件、生成的图片等）。
  - type: volume
    name: sub2api_data

  # 编排和配置文件。没有这些，新机器上光有数据库也拉不起服务。
  # 注意 .env 里含有密钥，restic 会加密存储，但清单本身不要提交到公开仓库。
  - type: files
    name: deploy-config
    paths:
      - /root/sub2api/deploy/docker-compose.yml
      - /root/sub2api/deploy/.env
      - /root/sub2api/deploy/Caddyfile

  # 记录当前运行容器的镜像 digest。
  # 恢复时按 digest 拉取，而不是按 :latest —— 半年后的 latest
  # 很可能已经和备份里的数据库 schema 对不上了。
  - type: image_digest
    services:
      - sub2api

# 备份触发时机，systemd OnCalendar 语法。
# 默认每天 04:17，即 RPO 24 小时。想要小时级改成 "*:17:00"。
schedule:
  on_calendar: "*-*-* 04:17:00"

# 保留策略，对应 restic forget。
retention:
  daily: 7
  weekly: 4
  monthly: 6
