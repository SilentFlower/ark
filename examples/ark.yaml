# ark 备份清单示例
#
# 这份清单只存在于 hub 上，一份描述全部被备份的机器。
# 被备份的机器上不需要安装 ark，有 docker 和 sshd 就够了。
#
# 复制到 /etc/ark/ark.yaml 后按实际情况修改，然后依次执行：
#   ark validate    # 检查清单本身写得对不对（不碰 docker 和网络，任何机器都能跑）
#   ark doctor --all # 检查 hub 和全部目标机是否真的具备执行条件

version: 2

# 备份仓库，全局唯一。所有机器的快照都进这一个仓库，靠 host tag 区分。
#
# 不要按机器分路径（.../bucket/web-01）——那会让跨机去重失效：
# 同一个基础镜像层、同样的配置文件本来只需要存一份。
#
# 重要：repo.password_file 的内容必须另外保存一份在 hub 之外
# （密码管理器 / 离线介质）。只存在于 hub 上的仓库密码，
# 在 hub 损毁时会让所有备份一起变成无法解密的废数据。
repo:
  type: restic
  url: "s3:https://<account-id>.r2.cloudflarestorage.com/<bucket>"
  password_file: /etc/ark/repo.pass
  env_file: /etc/ark/repo.env

# 各机器未显式覆盖时套用的默认值。
#
# 默认备份窗口刻意避开整点和半点：全世界的定时任务都挤在 0 分和 30 分，
# 错开几分钟能显著降低对象存储侧的并发冲突和限流概率。
defaults:
  schedule:
    on_calendar: "*-*-* 04:17:00" # 每天 04:17，即 RPO 24h
  retention:
    daily: 7
    weekly: 4
    monthly: 6

hosts:
  # ── hub 自己 ────────────────────────────────────────────────
  # hub 持有所有凭证和状态库，它自身损毁的后果最重，因此也必须被备份。
  # local: true 表示命令直接在本地执行，不走 SSH，这时不能再配 ssh 段。
  - host: hub-01
    local: true
    project:
      name: ark-hub
      compose_file: /root/ark-hub/docker-compose.yml
      project_name: ark-hub
    targets:
      # hub 的状态库必须单独作为一个 target。ark 会通过 SQLite online backup
      # 导出可独立恢复的单文件副本，绝不会在 WAL 运行期间直接 tar ark.db。
      - type: files
        name: ark-state
        paths:
          - /var/lib/ark/ark.db
      # 清单、known_hosts 和明确列出的 hub 服务配置。known_hosts 是服务器公钥，
      # 可随清单备份；repo.pass、repo.env、SSH 私钥和其它解密/登录密钥绝不能加入。
      # 不要把整个 /etc/ark 作为路径，否则会把凭证一起收入仓库。
      - type: files
        name: ark-config
        paths:
          - /etc/ark/ark.yaml
          - /etc/ark/ssh/known_hosts
          - /root/ark-hub/docker-compose.yml
      # 其它 hub 服务数据也要逐项显式配置；下面只是示例卷名，部署时按实际名称修改。
      - type: volume
        name: ark_hub_data
      - type: image_digest
        services:
          - ark-hub

  # ── 应用机 ──────────────────────────────────────────────────
  - host: web-01
    ssh:
      address: 10.0.0.11:22 # 端口必须显式写出
      user: root
      identity_file: /etc/ark/ssh/web-01.key
      # 必填的持久化信任库。默认 accept-new 只在首次连接自动记录主机密钥，
      # 后续密钥变化仍会拒绝；高安全环境可显式配置 host_key_policy: strict。
      # 没有完全跳过校验的开关。
      known_hosts_file: /etc/ark/ssh/known_hosts
    project:
      name: sub2api
      compose_file: /root/sub2api/deploy/docker-compose.yml
      env_file: /root/sub2api/deploy/.env
      # 显式声明 compose 项目名，避免误操作同一台机器上的另一套部署。
      project_name: deploy
    targets:
      # 数据库走 pg_dump 逻辑备份。
      # 绝不要改成直接备份 PGDATA 卷：运行中的数据目录热拷贝出来是不一致的。
      - type: postgres
        service: postgres
        database: sub2api
        user: sub2api

      # Redis 触发 BGSAVE 后取走 RDB。如果 Redis 里只有可重建的缓存，
      # 可以整条删掉以缩短备份时间。
      - type: redis
        service: redis

      # 应用数据卷（上传的文件、生成的图片等）。
      - type: volume
        name: sub2api_data

      # 编排和配置文件。没有这些，新机器上光有数据库也拉不起服务。
      # 注意 .env 里含有密钥，restic 会加密存储，但清单本身不要提交到公开仓库。
      - type: files
        name: deploy-config
        paths:
          - /root/sub2api/deploy/docker-compose.yml
          - /root/sub2api/deploy/.env
          - /root/sub2api/deploy/Caddyfile

      # 记录当前运行容器的镜像 digest。
      # 恢复时按 digest 拉取，而不是按 :latest —— 半年后的 latest
      # 很可能已经和备份里的数据库 schema 对不上了。
      - type: image_digest
        services:
          - sub2api
          - postgres
          - redis

  # ── 数据库机 ────────────────────────────────────────────────
  # 这台演示按机器覆盖默认值：数据变化快，备份更频繁、保留更久。
  - host: db-01
    ssh:
      address: 10.0.0.12:22
      user: root
      identity_file: /etc/ark/ssh/db-01.key
      known_hosts_file: /etc/ark/ssh/known_hosts
      # strict 要求主机密钥已经由管理员预先写入信任库。
      host_key_policy: strict
    project:
      name: pgcluster
      compose_file: /srv/pgcluster/docker-compose.yml
      project_name: pgcluster
    # 每 6 小时一次，同样避开整点。
    schedule:
      on_calendar: "*-*-* 00,06,12,18:23:00"
    # 显式写了 retention 就完全按写的执行，不会被补上 weekly / monthly。
    # 想要周备和月备就把它们一起写出来。
    retention:
      daily: 30
      weekly: 8
      monthly: 12
    targets:
      - type: postgres
        service: postgres
        database: app
        user: app
      - type: postgres
        service: postgres
        database: analytics
        user: app
      - type: files
        name: pgcluster-config
        paths:
          - /srv/pgcluster/docker-compose.yml
          - /srv/pgcluster/postgresql.conf
      - type: image_digest
        services:
          - postgres
